<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="1400" height="400">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <filter id="gw"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="fg"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <!-- 背景 -->
  
  <g fill="white">
    <circle cx="100" cy="60" r="0.8" opacity="0.2"/>
    <circle cx="350" cy="40" r="0.6" opacity="0.15"/>
    <circle cx="800" cy="90" r="0.7" opacity="0.2"/>
    <circle cx="1100" cy="50" r="0.5" opacity="0.15"/>
  </g>

  <!-- ===== 图标 ===== -->
  <g transform="translate(60, 20)">
    <!-- 桥底光晕 -->
    <ellipse cx="180" cy="330" rx="80" ry="15" fill="#7C3AED" opacity="0.05" filter="url(#fg)"/>

    <!-- 左桥墩 -->
    <rect x="148" y="200" width="36" height="140" rx="7" fill="url(#g1)" opacity="0.12"/>
    <rect x="148" y="200" width="36" height="140" rx="7" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <rect x="155" y="208" width="14" height="124" rx="3" fill="white" opacity="0.06"/>
    <!-- 电流 -->
    <path d="M 156 340 L 160 310 L 152 280 L 162 250 L 156 220" fill="none" stroke="#2563EB" stroke-width="1.5" filter="url(#gw)" opacity="0.7"/>
    <path d="M 168 340 L 172 310 L 164 280 L 174 250 L 168 215" fill="none" stroke="white" stroke-width="0.8" filter="url(#gw)" opacity="0.3"/>
    <circle cx="166" cy="200" r="10" fill="url(#g1)" filter="url(#gw)" opacity="0.8"/>
    <circle cx="166" cy="200" r="3.5" fill="white" opacity="0.9"/>

    <!-- 右桥墩 -->
    <rect x="330" y="200" width="36" height="140" rx="7" fill="url(#g1)" opacity="0.12"/>
    <rect x="330" y="200" width="36" height="140" rx="7" fill="none" stroke="url(#g1)" stroke-width="1.5" opacity="0.5"/>
    <rect x="337" y="208" width="14" height="124" rx="3" fill="white" opacity="0.06"/>
    <!-- 电流 -->
    <path d="M 350 340 L 346 310 L 356 280 L 344 250 L 354 220" fill="none" stroke="#2563EB" stroke-width="1.5" filter="url(#gw)" opacity="0.7"/>
    <path d="M 338 340 L 334 310 L 344 280 L 332 250 L 342 215" fill="none" stroke="white" stroke-width="0.8" filter="url(#gw)" opacity="0.3"/>
    <circle cx="348" cy="200" r="10" fill="url(#g1)" filter="url(#gw)" opacity="0.8"/>
    <circle cx="348" cy="200" r="3.5" fill="white" opacity="0.9"/>

    <!-- 拱桥 -->
    <path d="M 166 200 Q 256 90 348 200" fill="none" stroke="#A78BFA" stroke-width="10" opacity="0.08" filter="url(#fg)"/>
    <path d="M 166 200 Q 256 90 348 200" fill="none" stroke="url(#g2)" stroke-width="3" opacity="0.4" filter="url(#gw)"/>
    <path d="M 166 200 Q 256 90 348 200" fill="none" stroke="url(#g2)" stroke-width="1.2" opacity="0.9"/>

    <!-- ===== 电流沿桥流动 ===== -->
    <!-- 主电流 -->
    <path d="M 168 198 Q 220 120 256 100 Q 292 120 344 198" fill="none" stroke="white" stroke-width="2" filter="url(#gw)" opacity="0.7"/>
    <!-- 辅电流 -->
    <path d="M 172 200 Q 230 140 256 124 Q 282 140 340 200" fill="none" stroke="#2563EB" stroke-width="1" filter="url(#gw)" opacity="0.4"/>

    <!-- 电流节点 -->
    <g filter="url(#gw)">
      <circle cx="192" cy="172" r="2" fill="#2563EB" opacity="0.4"/>
      <circle cx="220" cy="140" r="2.5" fill="#2563EB" opacity="0.6"/>
      <circle cx="240" cy="118" r="3" fill="#A78BFA" opacity="0.8"/>
      <circle cx="256" cy="108" r="3.5" fill="white" opacity="0.9"/>
      <circle cx="272" cy="118" r="3" fill="#A78BFA" opacity="0.8"/>
      <circle cx="292" cy="140" r="2.5" fill="#2563EB" opacity="0.6"/>
      <circle cx="320" cy="172" r="2" fill="#2563EB" opacity="0.4"/>
    </g>

    <!-- 电流火花 -->
    <path d="M 253 104 L 255 110 L 258 106 L 260 112" fill="none" stroke="white" stroke-width="1.2" filter="url(#gw)" opacity="0.6"/>

    <!-- 桥面 -->
    <rect x="166" y="340" width="182" height="4" rx="2" fill="url(#g2)" opacity="0.15"/>

    <!-- 拱顶星标 -->
    <g transform="translate(256, 96)">
      <circle cx="0" cy="0" r="16" fill="url(#g2)" filter="url(#gw)" opacity="0.12"/>
      <circle cx="0" cy="0" r="10" fill="none" stroke="#2563EB" stroke-width="0.6" stroke-dasharray="2 3" opacity="0.25"/>
      <path d="M 0 -9 L 2.5 -2.5 L 9 -2.5 L 4 2 L 5.5 8 L 0 4.5 L -5.5 8 L -4 2 L -9 -2.5 L -2.5 -2.5 Z" fill="white" opacity="0.85" filter="url(#gw)"/>
    </g>
  </g>

  <!-- ===== 品牌文字 ===== -->
  <g transform="translate(520, 70)">
    <text x="0" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="130" font-weight="700" fill="url(#g1)" letter-spacing="1" opacity="0.9">Bridge</text>
    <text x="490" y="140" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="130" font-weight="800" fill="url(#g2)" letter-spacing="0" opacity="0.9">AI</text>
    <line x1="0" y1="175" x2="730" y2="175" stroke="url(#g2)" stroke-width="1" opacity="0.1"/>
    <text x="0" y="225" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#6B7280" letter-spacing="1" opacity="0.6">统一 AI 管理中枢</text>
    <text x="375" y="225" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="34" fill="#9CA3AF" letter-spacing="1" opacity="0.4">· 连接 · 管理 · 赋能</text>
  </g>
</svg>


