<body>

<script>

  tl.fromTo('.h2', {opacity:0, y:20}, {opacity:1, y:0, duration:0.6, ease:'power3.out'}, 0.2)

    .fromTo('.pill', {opacity:0, scale:0.9}, {opacity:1, scale:1, duration:0.6, ease:'back.out(1.4)'}, 3.0);
